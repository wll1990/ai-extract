spring:
  application:
    name: ai-extract

  # ---- PostgreSQL 主库 ----
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DATABASE:aiextract}
    username: ${PG_USER:wanglei}
    password: ${PG_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 主库不可用时快速失败并返回 503，不能挂到默认 30s 连接超时
      connection-timeout: 5000
      validation-timeout: 3000

  # ---- JPA / Hibernate ----
  jpa:
    hibernate:
      ddl-auto: validate         # 生产环境只用 validate，表结构由 Flyway 管理
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ---- Flyway 数据库迁移 ----
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 手工建表的历史库（无 flyway 历史）从 V50 起基线，只补 V51+；
    # 空库仍会从 V1 全量执行。已有 flyway 历史的库按 pending 版本继续。
    baseline-on-migrate: true
    baseline-version: 50
    validate-on-migrate: false   # 历史库存在已删除迁移，关闭校验避免启动失败

  # ---- Redis（分布式锁 / 缓存） ----
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      # 认证主读走 Redis：故障时必须快速失败并回源 DB，不能挂在默认 60s 命令超时上
      timeout: 2s
      connect-timeout: 2s

  # ---- JSON 序列化 ----
  # Boot 4 使用 Jackson 3；java.time 默认输出 ISO-8601 字符串。
  # 不再配置 write-dates-as-timestamps（该开关已移到 DateTimeFeature，
  # Boot 的 spring.jackson.serialization 映射不认这个枚举名）。

  # ---- FreeMarker（报告 HTML/Word 渲染） ----
  # 开启 HTML 自动转义：报告内容来自用户素材与 AI，未转义会形成存储型 XSS
  freemarker:
    settings:
      # FreeMarker 2.3.29 没有 auto_escaping 设置项；output_format=HTML 即可开启自动转义
      '[output_format]': HTML

  # ---- AI 大模型（DeepSeek） ----
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      # 报告/萃取的非流式调用可能跑 1-2 分钟；2.0 走官方 SDK(OkHttp)，
      # 超时只能在这里配置，RestClientCustomizer 不再生效。
      timeout: 180s
      chat:
        # 2.0 起 chat.options.* 已废弃，直接挂在 chat 下
        model: deepseek-chat
        temperature: 0.1        # 0=确定性最高 1=创意最高，萃取需要稳定结果
        max-tokens: 8192

    # pgvector starter 已移除：检索全部走 GrainRetriever 原生 SQL + com.pgvector.PGvector，
    # 不再自动装配 VectorStore / 创建 vector_store 表。

    # MCP Client：默认关闭；配置好外部 MCP server 后设 MCP_CLIENT_ENABLED=true
    mcp:
      client:
        enabled: ${MCP_CLIENT_ENABLED:false}
        name: ai-extract
        version: 1.0.0
        request-timeout: 10s

  # ---- @Scheduled 线程池 ----
  # 默认池只有 1 个线程：评测 Worker 的 tick 可能跑几十秒，会把心跳任务饿死，
  # 导致租约过期后被别的实例重复领取。至少 2 个线程（tick + heartbeat）。
  task:
    scheduling:
      thread-name-prefix: sched-
      pool:
        # P3 新增导出 worker 与待复核滞留扫描，4 线程容易互相饿死（长 tick 会挤掉心跳）
        size: 8

  # ---- @Async 线程池（向量化 / AI 调用） ----
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 100
        thread-name-prefix: embedding-

  # ---- 文件上传 ----
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# ---- 服务端口 & 上下文路径 ----
server:
  port: 8080
  servlet:
    context-path: /api/v1

# ---- 本地 AI 服务（FastAPI 侧边服务，如噪音清洗专用模型） ----
ai:
  service:
    url: http://localhost:8000
  # ---- 通义千问 / DashScope 嵌入服务 ----
  qwen:
    api-key: ${QWEN_API_KEY}
  # ---- 阿里云百炼 DashScope（语音识别 / 向量） ----
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:${QWEN_API_KEY}}
    # 华北2-北京工作空间，替换旧的 dashscope.aliyuncs.com
    base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com}
    embedding:
      model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v4}
      dimension: ${DASHSCOPE_EMBEDDING_DIM:1024}
    stt:
      model: ${DASHSCOPE_STT_MODEL:paraformer-realtime-v2}
      ws-url: ${DASHSCOPE_STT_WS_URL:wss://dashscope.aliyuncs.com/api-ws/v1/realtime}
      sample-rate: 16000
      format: pcm

# ---- 注册邀请令牌（用户登录态已迁到 Redis 会话） ----
jwt:
  secret: ${JWT_SECRET}
  cookie-secure: false           # 生产环境改为 true（仅 HTTPS 下发）

# ---- 合作方对接 ----
partner:
  # 必须由环境变量提供 32 字节 Base64 密钥；缺失时启动失败
  aes-key: ${PARTNER_AES_KEY:}

# ---- 文件存储（唯一写目标：阿里云 OSS） ----
storage:
  # 仅用于读取/迁移存量本地文件，新上传不再写入
  local:
    path: ./data/files
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    bucket: ${OSS_BUCKET:ai-extract}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}

# ============================================================
# 业务配置
# ============================================================
app:
  # ---- 企业模型端点 ----
  ai:
    # 本地开发放行 http://localhost（生产保持 false）
    allow-local-base-url: ${AI_ALLOW_LOCAL_BASE_URL:false}
    # 本地部署模型白名单（逗号分隔的域名/IP 后缀）：命中才允许 http/私网端点，
    # 留空则 Ollama / vLLM 等本地厂商一律不可配置，避免借企业 Key 探测内网
    local-model-hosts: ${AI_LOCAL_MODEL_HOSTS:}

  # ---- 鉴权 ----
  auth:
    query-token:
      mode: enforce          # enforce=仅 SSE 白名单路径接受 ?token=；log=灰度放行并告警
    session:
      b-end-idle-ttl: 2h          # B 端无操作 2h 失效
      b-end-absolute-ttl: 12h     # B 端会话绝对上限
      c-guest-idle-ttl: 7d
      c-user-idle-ttl: 30d
      c-absolute-ttl: 90d
      max-devices-per-user: 5
      single-session: false       # true = 新登录踢旧端
      touch-threshold: 0.5        # 剩余 TTL 低于 50% 才续期
      negative-cache-seconds: 5   # 无效 token 的进程内负缓存
      cookie-max-age: 30d         # HttpOnly Cookie 的浏览器保留上限（服务端 TTL 更短）
      cleanup-retention-days: 7   # 绝对过期后保留 7 天再物理删除（审计兜底）
      retry-interval-ms: 30000    # Redis 撤销失败后的补偿重放周期
    rate-limit:
      # 固定窗口：账号 60 次/15 分钟、IP 300 次/15 分钟。
      # 原 10/30 会把正常 QA 回归和办公室 NAT 误伤成 429，且账号维度仍能挡住暴力破解。
      login-per-account: 60
      login-per-ip: 300
      register-per-ip: 30

  # ---- CORS 跨域白名单 ----
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:3001

  # ============================================================
  # 素材上传限制 — 防止超大文件耗尽 LLM token 预算和 API 并发
  # 超过限制时向前端返回友好提示：不是不支持，而是拆分后效率更高、质量更好
  # ============================================================
  material:
    upload:
      max-file-size: 50MB                  # 单文件最大大小，需与上方 spring.servlet.multipart.max-file-size 保持一致
      max-text-length: 100000              # 解析后文本最大字数，约 3-4 小时访谈或 200 页文档，超过建议拆分为多个文件分批上传
      # 只列 ai-service 真正能解析的格式；.doc/.xls/.xlsx/.ppt/.m4a 无对应解析器，不要承诺
      supported-formats: txt,md,csv,html,htm,pdf,docx,pptx,png,jpg,jpeg,mp3,wav

  # ---- 知识与案例上传限制 ----
  # 单文件上限由 spring.servlet.multipart 统一控制（50MB）；这里限制解析后的文本量，
  # 避免一份几百页的产品说明书产出上千次 AI 调用、烧光预算还拖垮任务队列。
  knowledge:
    max-text-chars: 500000      # 解析后正文上限：约 500 页文档；超出请按章节拆分
  case:
    max-text-chars: 300000      # 案例文档上限：案例信息密度低，超过多半是无关叙述

    # ---- 报告生成 ----
    report:
      methodology-top-n: 20       # Part2 方法论（strategies+tactics+donts）取 top N 高质量颗粒（按 qualityScore 降序），控制 prompt 规模、报告更精炼
      faq-top-n: 15               # Part3 FAQ 取 top N 高质量颗粒，FAQ 是原文还原非归纳提炼，样本过多反而稀释重点

  # ============================================================
  # Query Gate — 统一安全门控（Controller 层前置拦截）
  # 运行时开关：redis-cli SET query_gate:enabled "false" 即时停用
  # ============================================================
  query-gate:
    # 总开关 — false 时所有规则停用，零性能损耗
    # Redis key "query_gate:enabled" 优先级更高，运维秒级操作无需重启
    enabled: true
    # 单条消息最大字符数 — 超过返回"消息过长"
    max-message-length: 8000

    # ── 频率控制（固定窗口，分钟级） ──
    rate-limit:
      ip-per-min: 60           # 单 IP 全局上限，兜底防 DDoS
      guest-per-min: 6         # C 端游客限频
      user-per-min: 20         # C 端注册用户限频
      partner-per-min: 20      # 合作方接入限频（此前落到 default=-1，不限频）
      employee-per-min: 30     # B 端员工限频
      b-end-im-per-min: -1     # IM 回调不限频（-1 跳过）

    # Redis 违禁词 Set — 热更新命令：SADD query_gate:banned_words "词"
    banned-words-redis-key: "query_gate:banned_words"

    # ── 敏感模式正则（编译时预编译，运行时 O(1)） ──
    sensitive-patterns:
      phone: '\b1[3-9]\d{9}\b'              # 手机号 — 误伤风险极低
      id-card: '\b\d{17}[\dXx]\b'           # 身份证号 — 误伤风险极低
      prompt-injection:                      # Prompt 注入攻击 — .{0,N} 防 ReDoS
        - '忽略.{0,50}(指令|上文|提示|规则|设定|限制)'
        - '(ignore|forget|override).{0,30}(instruction|prompt|rule)'
        - '(system|user|assistant).{0,20}(prompt|message)'
        - '从现在开始.{0,30}(角色|身份)'

  # ---- C 端萃取 & 访谈颗粒分级 ----
  interview:
    c-user-free-limit: 3           # C端用户免费萃取次数
    # 颗粒分级阈值（商业化运营调参）
    grain-enough: 10              # 报告就绪最低颗粒数（与 report.min-grains 保持一致）
    grain-suggest-more: 5         # 低于此值强烈引导用户继续补充

  # ---- 分身分享 & C 端游客体系 ----
  share:
    guest-message-limit: 25        # 游客免费消息额度（跨会话全局计数）
    c-user-message-limit: 100      # 注册用户每日免费消息额度（后续订阅分级在此调参）
    guest-token-ttl-days: 7       # 游客 token 有效期（天），每次访问滑动续期
    c-user-token-ttl-days: 30     # C 端注册用户 token 有效期（天）
    guest-create-per-ip-hour: 20  # 单 IP 每小时可创建的游客数（防批量薅额度）
    guest-msg-per-min: 6          # 单游客每分钟可发送的消息数（防脚本刷 AI 成本）

  # ---- 实战对练 / 评测中心 ----
  evaluation:
    auto-evaluate-turns: 12       # 自动评估前需完成的对话轮数
    auto-demo-rounds: 10          # ProductDemoModal 自动演示轮数
    # 单题评分与复核策略（EvaluationJudgeService）
    pass-threshold: 60            # 及格线（0-100）
    review-conf-threshold: 0.60   # AI 置信度低于此值必转人工复核
    review-band: 5                # 总分与及格线差值 ≤ band 视为临界分，必转人工复核
    # 执行器（EvaluationWorker）
    worker-enabled: true
    worker-interval-ms: 5000      # 两轮调度间隔（fixedDelay，上一轮结束才开始计时）
    worker-initial-delay-ms: 20000
    worker-runs-per-tick: 5       # 每轮最多推进的批次数
    worker-items-per-tick: 2      # 每批次每轮最多领取的题数
    lease-seconds: 900            # 单题租约时长，需覆盖一次答题+评分
    heartbeat-interval-ms: 60000  # 租约续租间隔

  # ---- 销售复盘（W2） ----
  sales:
    review:
      enabled: true
      worker-id: ""                 # 空 = hostname-pid
      worker-interval-ms: 5000
      worker-initial-delay-ms: 15000
      batch-size: 2
      max-attempts: 3
      lease-minutes: 10
      max-transcript-chars: 30000
      chat:
        max-total-per-session: 40
        max-per-minute: 10
    reminder:
      enabled: true
      interval-ms: 600000           # 10 分钟扫一次
      initial-delay-ms: 60000
      batch-size: 200

  # ---- 新人培训评分（T5） ----
  training:
    grading:
      pass-threshold: 60            # 任务未配置 pass_criteria 时的默认及格线
      review-conf-threshold: 0.60   # AI 置信度低于此值必转人工复核
      review-band: 5                # 总分与及格线差值 ≤ band 视为临界分，必转人工复核
      max-attempts: 3               # 单次尝试最多评分次数（含首次），防死循环重试
      worker-enabled: true
      worker-interval-ms: 5000
      worker-initial-delay-ms: 20000
      batch-size: 5                 # 每轮最多领取的尝试数
      lease-seconds: 900            # 租约时长，需覆盖一次考试多题判分
      heartbeat-interval-ms: 60000
      heartbeat-initial-delay-ms: 30000
    practice:
      max-messages-per-attempt: 40  # 单次陪练最多发言条数，防无限触发 LLM
      max-hints-per-attempt: 10     # 单次陪练最多提示次数（Redis 计数）
    deadline:
      enabled: true
      interval-ms: 60000            # 扫描间隔（fixedDelay）
      initial-delay-ms: 30000
      batch-size: 50                # 每类（考试/陪练）每轮最多处理条数
    remediation:
      max-rounds: 10                # 同一任务最多补训轮次（含首轮之后的追加）
    pending-review:
      enabled: true
      threshold-hours: 24           # 待复核/评分失败超过该时长提醒导师
      interval-ms: 300000           # 5 分钟扫一次
      initial-delay-ms: 60000
      batch-size: 50
    export:
      enabled: true
      worker-interval-ms: 15000
      worker-initial-delay-ms: 15000
      batch-size: 3
      lease-seconds: 900
      max-attempts: 3               # 领取超过该次数仍失败则直接置 failed，停止重试
      max-rows: 100000
      presign-seconds: 900          # OSS 下载地址有效期（PII，不要用头像的 365 天）

  # ---- RAG 检索配置 ----
  rag:
    query-rewrite:
      enabled: true               # 多轮对话指代消解
    min-similarity: 0.25          # 颗粒最低相似度阈值，低于此值不进 LLM（触发边界规则）
    top-k: 5                      # 单次检索最大返回颗粒数
    kc-top-k: 3                   # 知识/案例追加检索每类最大返回数（Phase B）
    # 0.35 时无关内容（如「客户骂我」命中「退款口径」）也能过线：实测无关样本集中在 0.36–0.42。
    # 0.45 留出可解释的安全边界；检索测试会单独用诊断阈值展示「近失命中」。
    kc-knowledge-min-similarity: 0.45  # 知识命中最低相似度阈值
    kc-case-min-similarity: 0.50       # 案例命中最低相似度阈值（叙事型，挡掉「泛销售」基底噪音）
    # 上下文预检：预算 = (context-max-tokens - output-reserve-tokens) × safety-ratio
    # DeepSeek 真实窗口 64K；多厂商接入后由 ProviderCatalog 按模型覆盖
    context-max-tokens: 65536
    output-reserve-tokens: 8192   # 为模型输出预留
    safety-ratio: 0.9             # 估算误差与协议开销余量
    min-keep-messages: 6          # 裁剪后至少保留的最近消息数（含当前问题）
    chars-per-token: 1.5          # 初始系数；运行期用真实 Usage 校准
    max-system-prompt-chars: 24000 # 系统提示词硬上限，超出保留头尾
    hybrid-search:
      enabled: true               # Hybrid Search (Dense + BM25 → RRF)混合检索

  # ---- 聊天流超时（秒） ----
  chat:
    timeout-seconds: 180           # Flux SSE 流超时，AI 慢响应时防止误杀

  # ---- 工作流执行器 ----
  workflow:
    worker-interval-ms: 5000
    worker-initial-delay-ms: 15000
    runs-per-tick: 2
    max-attempts: 3
    lease-seconds: 60

  # ---- IM 渠道接入（飞书/钉钉/企微） ----
  im:
    bridge-url: ${IM_BRIDGE_URL:http://localhost:3010}    # Node 飞书桥地址（与 scripts/start-feishu-bot.sh 的 3010 一致）
    bridge-token: ${IM_BRIDGE_TOKEN:dev-im-bridge-token}  # 内部 HMAC 共享密钥（生产必须经 env 注入）
    rate-limit:
      per-min: 120          # 每 bot 每分钟消息上限（-1 关闭，IM 独立限流）

  # ---- Practice 对练追问策略 ----
  practice:
    kc-default-enabled: false     # 对练是否检索知识/案例的全局默认；企业可在线覆盖（company_setting）
    max-retries-per-angle: 2      # 同一角度最多追问次数
    question-templates:           # 追问话术模板，%s 替换为反例标签
      - "在「%s」方面，你是怎么应对的？"
      - "能分享一个「%s」的真实案例吗？"
      - "遇到「%s」的问题，最关键的步骤是什么？"
      - "「%s」时，有没有特别有效的具体话术？"
      - "如果「%s」失败了，复盘时最常发现什么原因？"

  # ---- 访谈颗粒与报告阈值（可配置，商业化运营调参） ----
  # ---- 报告生成门槛 ----
  report:
    min-grains: 10                # 触发报告生成的最小活跃颗粒数
    min-scenes: 3                 # 触发报告生成的最小场景覆盖数

  # ---- 自动发现引擎（知识缺口 → 洞察 → 候选颗粒） ----
  insight:
    embed-batch-size: 20          # 每天凌晨嵌入处理批大小
    cluster-threshold: 0.15       # 余弦距离聚类阈值（< 此值视为同类缺口）
    min-attempts: 20               # 触发洞察的最低累计提问次数

# ---- 日志 ----
logging:
  level:
    org.springframework.security: INFO
