<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>创始人分身 · 交互原型</title>
<style>
/* ═══════════════════════════════════════════════════════════
   创始人分身 · 交互原型
   两套视觉：深色权威（金）+ 明亮商务（蓝）
   ═══════════════════════════════════════════════════════════ */

/* ── 深色权威主题（默认）── */
:root, [data-theme="dark"] {
  --bg: #0a0d12;
  --surface: #0f141b;
  --surface-2: #141a23;
  --card: rgba(20, 26, 35, 0.82);
  --card-solid: #151c26;
  --foreground: #e8edf3;
  --muted: #9aa5b1;
  --muted-2: #6b7683;
  --border: #232b36;
  --border-strong: #2f3a48;
  --accent: #c8a45c;          /* 金 */
  --accent-strong: #e2b96f;
  --accent-soft: rgba(200, 164, 92, 0.12);
  --accent-glow: rgba(200, 164, 92, 0.28);
  --gradient-primary: linear-gradient(135deg, #d4af6a 0%, #c8a45c 55%, #a8823e 100%);
  --success: #3fb986;
  --success-bg: rgba(63, 185, 134, 0.12);
  --warning: #d9a84e;
  --warning-bg: rgba(217, 168, 78, 0.12);
  --danger: #e56b6b;
  --danger-bg: rgba(229, 107, 107, 0.12);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.35);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.45);
  --shadow-lg: 0 18px 48px rgba(0,0,0,0.55);
  --shadow-glow: 0 0 0 4px rgba(200,164,92,0.16), 0 0 32px rgba(200,164,92,0.22);
  --hero-grad: radial-gradient(circle at 15% 20%, rgba(200,164,92,0.14), transparent 40%),
              radial-gradient(circle at 85% 10%, rgba(100,140,180,0.10), transparent 35%),
              linear-gradient(165deg, #0b0f15 0%, #0f141b 50%, #0c1017 100%);
}

/* ── 明亮商务主题 ── */
[data-theme="light"] {
  --bg: #ffffff;
  --surface: #f8fafc;
  --surface-2: #ffffff;
  --card: rgba(255, 255, 255, 0.92);
  --card-solid: #ffffff;
  --foreground: #1e293b;
  --muted: #64748b;
  --muted-2: #94a3b8;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --accent: #2563eb;          /* 蓝 */
  --accent-strong: #1d4ed8;
  --accent-soft: rgba(37, 99, 235, 0.08);
  --accent-glow: rgba(37, 99, 235, 0.22);
  --gradient-primary: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
  --success: #16a34a;
  --success-bg: #dcfce7;
  --warning: #d97706;
  --warning-bg: #fef3c7;
  --danger: #dc2626;
  --danger-bg: #fef2f2;
  --shadow-sm: 0 1px 2px rgba(15,23,42,0.06);
  --shadow-md: 0 8px 20px rgba(15,23,42,0.08);
  --shadow-lg: 0 18px 44px rgba(15,23,42,0.12);
  --shadow-glow: 0 0 0 4px rgba(37,99,235,0.14), 0 0 30px rgba(59,130,246,0.22);
  --hero-grad: radial-gradient(circle at 15% 20%, rgba(37,99,235,0.08), transparent 40%),
              radial-gradient(circle at 85% 10%, rgba(6,182,212,0.06), transparent 35%),
              linear-gradient(165deg, #f8fafc 0%, #ffffff 50%, #f1f5f9 100%);
}

/* ── 基础 ── */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Inter', sans-serif;
  background: var(--bg);
  color: var(--foreground);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "rlig" 1, "calt" 1;
  transition: background 0.4s ease, color 0.4s ease;
  overflow: hidden;
}

/* ── 应用骨架 ── */
.app { display: flex; height: 100vh; }

/* 左侧导航 */
.sidebar {
  width: 224px; flex: none; display: flex; flex-direction: column;
  background: var(--surface); border-right: 1px solid var(--border);
  transition: background 0.4s ease, border-color 0.4s ease;
}
.sidebar-logo {
  padding: 22px 20px 16px; font-size: 15px; font-weight: 700; letter-spacing: 0.02em;
  color: var(--foreground); display: flex; align-items: center; gap: 8px;
}
.sidebar-logo .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--gradient-primary); flex: none; }
.sidebar-sub { padding: 0 20px 6px; font-size: 11px; color: var(--muted-2); letter-spacing: 0.08em; text-transform: uppercase; }
.sidebar-nav { flex: 1; overflow-y: auto; padding: 6px 12px; }
.nav-item {
  display: flex; align-items: center; gap: 11px; padding: 11px 12px; border-radius: 10px;
  font-size: 13.5px; color: var(--muted); cursor: pointer; transition: all 0.18s ease; margin-bottom: 2px;
  border: 1px solid transparent;
}
.nav-item:hover { background: var(--surface-2); color: var(--foreground); }
.nav-item.on {
  background: var(--accent-soft); color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 22%, transparent);
  font-weight: 600;
}
.nav-item .ico { font-size: 16px; width: 22px; text-align: center; flex: none; opacity: 0.9; }
.nav-item .badge { margin-left: auto; font-size: 10px; font-weight: 700; background: var(--accent-soft); color: var(--accent); padding: 2px 7px; border-radius: 99px; }

/* 主题切换区 */
.sidebar-theme { padding: 14px 16px; border-top: 1px solid var(--border); }
.theme-toggle {
  display: flex; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 10px; padding: 3px; gap: 3px;
}
.theme-btn {
  flex: 1; padding: 7px 0; font-size: 12px; font-weight: 600; text-align: center;
  border: none; border-radius: 8px; cursor: pointer; background: transparent; color: var(--muted);
  font-family: inherit; transition: all 0.18s ease;
}
.theme-btn.on { background: var(--accent); color: #0a0d12; box-shadow: var(--shadow-sm); }
[data-theme="light"] .theme-btn.on { color: #ffffff; }
.theme-hint { font-size: 10.5px; color: var(--muted-2); text-align: center; margin-top: 8px; line-height: 1.5; }

/* 主内容区 */
.main { flex: 1; min-width: 0; overflow-y: auto; position: relative; }

/* 视图容器 */
.view { display: none; min-height: 100%; animation: viewIn 0.45s cubic-bezier(0.22, 1, 0.36, 1); }
.view.on { display: block; }
@keyframes viewIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── 顶部栏（每个视图内的局部 header）── */
.viewbar {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px;
  padding: 16px 32px; background: color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.viewbar .crumb { font-size: 13px; color: var(--muted-2); }
.viewbar .crumb b { color: var(--foreground); font-weight: 600; }
.viewbar .spacer { flex: 1; }
.viewbar .btn { font-size: 13px; font-weight: 600; padding: 8px 18px; border-radius: 9px; cursor: pointer; border: none; font-family: inherit; transition: all 0.18s ease; }
.btn-accent { background: var(--gradient-primary); color: #fff; }
[data-theme="dark"] .btn-accent { color: #0a0d12; font-weight: 700; }
.btn-accent:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border) !important; }
.btn-ghost:hover { color: var(--foreground); background: var(--surface-2); }

/* 内容容器 */
.content { padding: 28px 32px 64px; max-width: 1080px; margin: 0 auto; }

/* ── 通用组件 ── */
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 24px; box-shadow: var(--shadow-sm); backdrop-filter: blur(10px);
  transition: background 0.4s ease, border-color 0.4s ease;
}
.eyebrow {
  display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px;
}
.eyebrow::before { content: ''; width: 18px; height: 2px; background: var(--accent); border-radius: 1px; }
.sec-title { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px; }
.sec-desc { font-size: 13px; color: var(--muted); line-height: 1.7; }

/* 标签 */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 4px 11px; border-radius: 99px; border: 1px solid var(--border); color: var(--muted); background: var(--surface-2); }
.pill-accent { border-color: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--accent); background: var(--accent-soft); }

/* 徽标 */
.badge-s { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 99px; letter-spacing: 0.03em; }
.badge-s.s { background: var(--accent-soft); color: var(--accent); }
.badge-s.a { background: var(--warning-bg); color: var(--warning); }
.badge-s.c { background: var(--success-bg); color: var(--success); }
.badge-s.d { background: color-mix(in srgb, var(--muted-2) 14%, transparent); color: var(--muted-2); }

/* ── 动效 keyframes（复用 shared-ui 组件语义）── */
@keyframes bars { 50% { height: 5px; opacity: 0.4; } }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
@keyframes avRotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@keyframes avShimmer { 0% { transform: translateX(-100%) rotate(25deg); } 100% { transform: translateX(200%) rotate(25deg); } }
@keyframes avGlow { 0%,100% { opacity: 0.25; } 50% { opacity: 0.55; } }
@keyframes float1 { 0%,100% { transform: translate(0,0) scale(1); opacity: 0.6; } 50% { transform: translate(2px,-3px) scale(1.3); opacity: 1; } }
@keyframes float2 { 0%,100% { transform: translate(0,0) scale(1); opacity: 0.5; } 50% { transform: translate(-2px,3px) scale(1.2); opacity: 0.9; } }
@keyframes float3 { 0%,100% { transform: translate(0,0) scale(1); opacity: 0.7; } 50% { transform: translate(3px,2px) scale(1.1); opacity: 1; } }
@keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes radarSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes barGrow { from { width: 0; } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

/* 分段渐入（判断卡片四段依次出现） */
.seg { opacity: 0; animation: fadeUp 0.5s cubic-bezier(0.22,1,0.36,1) forwards; }
.seg-1 { animation-delay: 0.1s; } .seg-2 { animation-delay: 0.35s; }
.seg-3 { animation-delay: 0.6s; } .seg-4 { animation-delay: 0.85s; }
.seg-5 { animation-delay: 1.1s; }

/* ═══════ P1 思想档案 ═══════ */
.archive-hero {
  position: relative; border-radius: 20px; overflow: hidden; padding: 48px 40px 44px;
  background: var(--hero-grad); border: 1px solid var(--border);
}
.archive-hero-inner { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; text-align: center; }

/* 头像光环（复用 DefaultAvatar）*/
.av-wrap { width: 108px; height: 108px; position: relative; margin-bottom: 22px; }
.av-halo { position: absolute; inset: -7px; border-radius: 50%; background: conic-gradient(from 0deg, var(--accent), var(--accent-strong), color-mix(in srgb, var(--accent) 40%, #818cf8), var(--accent)); opacity: 0.32; animation: avRotate 6s linear infinite; filter: blur(7px); }
.av-glow { position: absolute; inset: -3px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, var(--accent-glow), transparent 70%); animation: avGlow 3s ease-in-out infinite; }
.av-body { position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(145deg, var(--accent) 0%, var(--accent-strong) 45%, color-mix(in srgb, var(--accent) 50%, #6b7280) 100%); overflow: hidden; display: flex; align-items: center; justify-content: center; }
.av-body .shimmer { position: absolute; inset: 0; background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.45) 47%, rgba(255,255,255,0.65) 50%, rgba(255,255,255,0.45) 53%, transparent 60%); animation: avShimmer 3.5s ease-in-out infinite; }
.av-body svg { width: 44%; height: 44%; position: relative; z-index: 2; }
.av-spark { position: absolute; border-radius: 50%; background: #fff; z-index: 3; }
.av-spark.s1 { top: 12%; left: 82%; width: 6px; height: 6px; animation: float1 3s ease-in-out infinite; }
.av-spark.s2 { top: 78%; left: 8%; width: 5px; height: 5px; animation: float2 3s ease-in-out infinite 0.6s; }
.av-spark.s3 { top: 14%; left: 14%; width: 4px; height: 4px; animation: float3 3s ease-in-out infinite 1.2s; }
.av-spark.s4 { top: 80%; left: 84%; width: 5px; height: 5px; animation: float1 3s ease-in-out infinite 0.3s; }

.archive-name { font-size: 22px; font-weight: 800; letter-spacing: 0.01em; margin-bottom: 4px; }
.archive-role { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
.archive-claim {
  font-size: 17px; font-weight: 600; color: var(--accent); line-height: 1.6;
  padding: 12px 22px; border-radius: 12px; background: var(--accent-soft);
  border: 1px solid color-mix(in srgb, var(--accent) 24%, transparent);
  max-width: 520px; margin: 0 auto 30px;
}
.archive-claim::before { content: '「'; opacity: 0.5; } .archive-claim::after { content: '」'; opacity: 0.5; }

/* 覆盖度条 */
.coverage-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; max-width: 760px; margin: 0 auto 30px; width: 100%; }
.cov-item { text-align: left; }
.cov-item .cov-name { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
.cov-item .cov-name b { color: var(--foreground); font-weight: 700; }
.cov-track { height: 6px; background: color-mix(in srgb, var(--muted-2) 16%, transparent); border-radius: 99px; overflow: hidden; }
.cov-fill { height: 100%; border-radius: 99px; background: var(--gradient-primary); animation: barGrow 1s cubic-bezier(0.22,1,0.36,1) forwards; transform-origin: left; }

/* 代表性观点 */
.views-list { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; text-align: left; }
.view-item {
  display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--border); cursor: pointer; transition: all 0.18s ease;
}
.view-item:hover { border-color: var(--accent); box-shadow: var(--shadow-md); transform: translateY(-1px); }
.view-item .vi-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; margin-top: 6px; }
.view-item .vi-title { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
.view-item .vi-desc { font-size: 12.5px; color: var(--muted); line-height: 1.6; }
.view-item .vi-arrow { margin-left: auto; color: var(--muted-2); flex: none; margin-top: 2px; }

/* 底部输入框 */
.archive-ask { max-width: 680px; margin: 30px auto 0; display: flex; gap: 10px; }
.archive-ask input {
  flex: 1; height: 52px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface-2);
  padding: 0 18px; font-size: 14px; color: var(--foreground); outline: none; font-family: inherit;
  transition: all 0.2s ease;
}
.archive-ask input:focus { border-color: var(--accent); box-shadow: var(--shadow-glow); }
.archive-ask button {
  height: 52px; padding: 0 26px; border-radius: 14px; border: none; cursor: pointer;
  background: var(--gradient-primary); font-size: 14px; font-weight: 700; font-family: inherit;
  transition: all 0.18s ease;
}
[data-theme="dark"] .archive-ask button { color: #0a0d12; }
[data-theme="light"] .archive-ask button { color: #fff; }
.archive-ask button:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }

/* ═══════ P2 对话页 ═══════ */
.chat-wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; min-height: calc(100vh - 130px); }
.chat-scroll { flex: 1; padding: 20px 4px 8px; display: flex; flex-direction: column; gap: 18px; }

.msg { display: flex; flex-direction: column; gap: 6px; animation: msgIn 0.4s cubic-bezier(0.22,1,0.36,1); }
.msg-user { align-items: flex-end; }
.msg-ai { align-items: flex-start; }

.msg-label { font-size: 11px; color: var(--muted-2); font-weight: 600; padding: 0 4px; }
.msg-ai .msg-label { color: var(--accent); }

.bubble {
  max-width: 86%; padding: 13px 16px; border-radius: 16px; font-size: 14px; line-height: 1.7;
  background: var(--surface-2); border: 1px solid var(--border);
}
.msg-user .bubble { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 26%, transparent); border-bottom-right-radius: 6px; }
.msg-ai .bubble { border-bottom-left-radius: 6px; }

/* 判断卡片 */
.judgment {
  width: 92%; border-radius: 16px; overflow: hidden; border: 1px solid var(--border);
  background: var(--card); box-shadow: var(--shadow-sm);
}
.judgment-infer { border-color: color-mix(in srgb, var(--warning) 40%, transparent); }
.judgment-banner {
  display: flex; align-items: center; gap: 8px; padding: 10px 16px; font-size: 12.5px; font-weight: 600;
  background: var(--warning-bg); color: var(--warning); border-bottom: 1px solid color-mix(in srgb, var(--warning) 24%, transparent);
  animation: fadeUp 0.4s ease;
}
.judgment-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 13px; }
.jseg { display: flex; gap: 12px; }
.jseg .jseg-tag {
  flex: none; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 7px; height: fit-content;
  color: var(--accent); background: var(--accent-soft); letter-spacing: 0.04em; margin-top: 1px;
}
.jseg .jseg-txt { font-size: 14px; line-height: 1.7; color: var(--foreground); }
.jseg .jseg-txt b { font-weight: 700; color: var(--accent); }

/* 溯源 */
.cite-bar { border-top: 1px solid var(--border); padding: 12px 20px; }
.cite-toggle { font-size: 12.5px; color: var(--accent); cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
.cite-toggle:hover { opacity: 0.8; }
.cite-panel {
  margin-top: 10px; padding: 13px 15px; border-radius: 10px; background: var(--surface);
  border: 1px solid var(--border); font-size: 12.5px; line-height: 1.7; color: var(--muted);
  display: none; animation: fadeUp 0.3s ease;
}
.cite-panel.open { display: block; }
.cite-panel .cite-src { color: var(--accent); font-weight: 600; margin-bottom: 4px; font-size: 11.5px; }
.cite-panel .cite-quote { border-left: 2px solid var(--accent); padding-left: 10px; }

/* 代笔草稿卡 */
.draft {
  width: 92%; border-radius: 16px; overflow: hidden; border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent);
  background: var(--card); box-shadow: var(--shadow-sm);
}
.draft-banner {
  display: flex; align-items: center; gap: 8px; padding: 10px 16px; font-size: 12.5px; font-weight: 600;
  background: var(--accent-soft); color: var(--accent); border-bottom: 1px solid color-mix(in srgb, var(--accent) 20%, transparent);
  animation: fadeUp 0.4s ease;
}
.draft-body { padding: 18px 20px; font-size: 14px; line-height: 1.8; color: var(--foreground); white-space: pre-wrap; }

/* 百科答案卡 */
.faq {
  width: 92%; border-radius: 16px; overflow: hidden; border: 1px solid var(--border);
  background: var(--card); box-shadow: var(--shadow-sm);
}
.faq-head { display: flex; align-items: center; gap: 8px; padding: 10px 16px; font-size: 12px; font-weight: 700; color: var(--muted); border-bottom: 1px solid var(--border); }
.faq-head .faq-ico { color: var(--accent); }
.faq-body { padding: 16px 20px; font-size: 14px; line-height: 1.8; color: var(--foreground); }
.faq-time { margin-top: 10px; font-size: 11.5px; color: var(--muted-2); }

/* 反向追问卡 */
.ask-more {
  width: 92%; border-radius: 16px; overflow: hidden; border: 1px solid var(--border);
  background: var(--card); box-shadow: var(--shadow-sm);
}
.ask-more-body { padding: 16px 20px; }
.ask-more-body .am-title { font-size: 13.5px; font-weight: 700; color: var(--foreground); margin-bottom: 8px; }
.ask-more-body .am-list { display: flex; flex-direction: column; gap: 6px; }
.ask-more-body .am-item { display: flex; gap: 8px; font-size: 13.5px; line-height: 1.6; color: var(--muted); }
.ask-more-body .am-item::before { content: '·'; color: var(--accent); font-weight: 700; }

/* 思考动画卡 */
.thinking { max-width: 88%; padding: 14px 18px; }
.thinking-row { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
.thinking-bars { display: inline-flex; align-items: flex-end; gap: 3px; height: 16px; }
.thinking-bars span { width: 3px; border-radius: 4px; background: var(--accent); display: inline-block; animation: bars 1s ease-in-out infinite; }
.thinking-copy { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.thinking-track { height: 3px; background: color-mix(in srgb, var(--accent) 12%, transparent); border-radius: 99px; overflow: hidden; }

/* 回填清单 P9 + 补充技能表单 */

.chk-list { display: flex; flex-direction: column; gap: 8px; }

.add-switch { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 11px; padding: 3px; margin-bottom: 16px; }

</style>
</head>

function initTheme() {

/* ═══════════════ P2 对话交互 ═══════════════ */
function initChat() {
  if (chatStarted) { renderChat(); return; }
  chatStarted = true;
  // 首条欢迎消息
  chatMessages = [{ role: 'ai', type: 'intro', text: `你好，我是 ${FOUNDER.name} 的分身。员工在做决策前，可以先和我聊聊，我会用老板的判断逻辑帮你把问题想清楚。` }];
  renderChat();
}

function renderChat() {
  const sc = document.getElementById('chatScroll');
  if (!sc) return;
  sc.innerHTML = chatMessages.map(m => {
    if (m.role === 'user') return `<div class="msg msg-user"><div class="msg-label">你</div><div class="bubble">${m.text}</div></div>`;
    if (m.type === 'intro') return `<div class="msg msg-ai"><div class="msg-label">${FOUNDER.name} · 分身</div><div class="bubble">${m.text}</div></div>`;
    if (m.type === 'thinking') return `
      <div class="msg msg-ai">
        <div class="bubble thinking">
          <div class="thinking-row">${FOUNDER.name}正在思考
            <span class="thinking-bars"><span style="height:7px"></span><span style="height:13px;animation-delay:.15s"></span><span style="height:16px;animation-delay:.3s"></span><span style="height:10px;animation-delay:.45s"></span></span>
          </div>
          <div class="thinking-copy">正在检索老板的判断原则，组织表达…</div>
          <div class="thinking-track"><span></span></div>
        </div>
      </div>`;
    if (m.type === 'judgment') return `
      <div class="msg msg-ai">
        <div class="msg-label">${FOUNDER.name} · 分身</div>
        <div class="judgment ${m.infer ? 'judgment-infer' : ''}">
          ${m.infer ? `<div class="judgment-banner">⚠️ 此为推断，非老板原话</div>` : ''}
          <div class="judgment-body">
            <div class="jseg seg"><div class="jseg-tag">原则</div><div class="jseg-txt">${m.principle}</div></div>
            <div class="jseg seg seg-1"><div class="jseg-tag">分析</div><div class="jseg-txt">${m.analysis}</div></div>
            <div class="jseg seg seg-2"><div class="jseg-tag">结论</div><div class="jseg-txt">${m.conclusion}</div></div>
            <div class="jseg seg seg-3"><div class="jseg-tag">边界</div><div class="jseg-txt">${m.boundary}</div></div>
          </div>
          <div class="cite-bar">
            <span class="cite-toggle" onclick="toggleCite(this)">📎 [1] ${m.source}  ▾</span>
            <div class="cite-panel">
              <div class="cite-src">来源：${m.source}</div>
              <div class="cite-quote">${m.quote}</div>
            </div>
          </div>
        </div>
      </div>`;
    if (m.type === 'draft') return `
      <div class="msg msg-ai">
        <div class="msg-label">${FOUNDER.name} · 分身</div>
        <div class="draft">
          <div class="draft-banner">✍️ AI 草稿 · 需本人润色后对外</div>
          <div class="draft-body">${m.text}</div>
        </div>
      </div>`;
    if (m.type === 'faq') return `
      <div class="msg msg-ai">
        <div class="msg-label">${FOUNDER.name} · 分身</div>
        <div class="faq">
          <div class="faq-head"><span class="faq-ico">📋</span> 公司百科 · 标准答案</div>
          <div class="faq-body">${m.text}</div>
          ${m.time ? `<div class="faq-time">${m.time}</div>` : ''}
          <div class="cite-bar">
            <span class="cite-toggle" onclick="toggleCite(this)">📎 ${m.source}  ▾</span>
            <div class="cite-panel"><div class="cite-src">来源：${m.source}</div><div class="cite-quote">${m.quote || ''}</div></div>
          </div>
        </div>
      </div>`;
    if (m.type === 'ask-more') return `
      <div class="msg msg-ai">
        <div class="msg-label">${FOUNDER.name} · 分身</div>
        <div class="ask-more">
          <div class="ask-more-body">
            <div class="am-title">要判断这件事，我还需要先知道几件事（老板的习惯是拿全信息再拍板）：</div>
            <div class="am-list">${m.items.map(i => `<div class="am-item">${i}</div>`).join('')}</div>
          </div>
        </div>
      </div>`;
    if (m.type === 'sensitive') return `<div class="msg msg-ai"><div class="msg-label">${FOUNDER.name} · 分身</div><div class="bubble">${m.text}</div></div>`;
    if (m.type === 'empty') return `<div class="msg msg-ai"><div class="msg-label">${FOUNDER.name} · 分身</div><div class="bubble">${m.text}</div></div>`;
    return '';
  }).join('');
  sc.scrollTop = sc.scrollHeight;
}

function toggleCite(el) {
  el.nextElementSibling.classList.toggle('open');
}

function sendChat() {
  const input = document.querySelector('.chat-composer input');
  const q = (input.value || '').trim();
  if (!q) return;
  input.value = '';
  chatMessages.push({ role: 'user', text: q });
  renderChat();
  // 思考动画
  chatMessages.push({ role: 'ai', type: 'thinking' });
  renderChat();
  // 根据问题类型生成回复
  setTimeout(() => {
    chatMessages.pop(); // 移除 thinking
    const reply = buildReply(q);
    chatMessages.push(...reply);
    renderChat();
  }, 1600);
}

function buildReply(q) {
  // 敏感拦截（最高优先级）
  if (/薪酬|工资|薪资|谁离职|裁员|并购|收购|法律|诉讼/.test(q)) {
    return [{ role: 'ai', type: 'sensitive', text: '这个问题涉及敏感信息，我建议你直接问老板本人。' }];
  }
  // 代笔类（帮我写/起草/生成 + 路演/融资/文章）
  if (/帮我写|起草|生成|路演|融资叙事|融资口径|创赛|行业观点|演讲稿|写个/.test(q)) {
    return [{ role: 'ai', type: 'draft', text: '我们是「XX 科技」，专注为 Tier1 车厂提供智能质检解决方案。\n\n我们的核心价值：用视觉 AI 把产线质检误检率从行业平均 3% 降到 0.3%，单条产线每年为客户节省约 200 万返工成本。\n\n一句话融资叙事：我们不是在卖软件，是在把中国制造的质量成本打下来。' }];
  }
  // 百科类（是什么/流程/参数/分工/报销）
  if (/是什么|流程|报销|合伙人|分工|参数|制度|融资阶段|多少|在哪|怎么申请/.test(q)) {
    return [{ role: 'ai', type: 'faq', text: '报销流程：① 在 OA 系统提交报销单，附发票照片 → ② 直属上级审批 → ③ 财务复核 → ④ 打款到工资卡，通常 3 个工作日内到账。\n\n超过 5000 元的报销需提前在 OA 提交预算申请。', time: '⏱️ 截至 2026-08 公司制度 V3 版，以最新 OA 公示为准', source: '《报销管理制度》第 2 节', quote: '「单笔超过 5000 元的报销，需提前提交预算申请，经部门负责人审批后方可执行。」' }];
  }
  // 反向追问（信息不足，无法判断）
  if (/怎么协调|怎么定|怎么权衡|要不要跟|该不该进.*(但|呢)$/.test(q) && /怎么协调|怎么定/.test(q)) {
    return [{ role: 'ai', type: 'ask-more', items: ['这笔单子的成本和毛利是多少？低于成本价的单子我不碰。', '采购周期和交付节点卡在哪个环节？是供应跟不上还是排期冲突？', '这单是不是我们重点客户的战略需求？还是普通的补货单？'] }];
  }
  // 空态（出海/东南亚）
  if (/东南亚|出海|国际化/.test(q)) {
    return [{ role: 'ai', type: 'empty', text: '老板未对这个问题明确表过态。不过关于「多元化扩张」，他有相邻原则可以给你参考——' },
            { role: 'ai', type: 'judgment', infer: true, principle: '企业多元化只有两种赢法：技术同源，或渠道复用。两头都不沾的，本质是投机。', analysis: '出海属于地理维度的扩张，本质要问的是：我们现有的技术或渠道，能不能直接复用到海外市场？如果能，就是结构性优势；如果不能，就是重新打一遍。', conclusion: '在没有验证结构性优势前，不建议大举出海，可以先做小规模试点。', boundary: '若海外存在我们单点可突破的标杆客户，可以为其破例，但不算系统性的出海战略。', source: '2024 战略会纪要', quote: '「多元化只有两种赢法：技术同源，或渠道复用。两头都不沾的多元化，本质是投机。」' }];
  }
  // 默认：判断一致（市场进入）
  return [{ role: 'ai', type: 'judgment', infer: false, principle: '判断该不该进一个市场，先看天花板够不够大，再看我们有没有别人短期追不上的结构性优势。', analysis: '这个新市场的天花板约 50 亿，但已经挤进了 6 家头部玩家，竞争充分。而我们目前没有独家渠道或技术壁垒，进场只能打价格战。', conclusion: '暂不进入，观察 6 个月。这期间验证两件事：天花板是否还在扩大、我们能否通过合作拿到结构性位置。', boundary: '如果我们能并购拿下头部位置，或拿到独家渠道，则另当别论。', source: '2024 战略会纪要', quote: '「与其在一个 500 亿的市场里当第 7 名，不如在一个 50 亿的市场里当第一名，因为后者有定价权。」' }];
}

function resetChat() {
  chatStarted = false;
  chatMessages = [];
  initChat();
}

/* ═══════════════ P3 上传交互 ═══════════════ */
const SAMPLE_FILES = [
  { name: '2026 战略规划.docx', type: 'strategy', level: 'S' },
  { name: '全员信-价值观.md', type: 'all_hands', level: 'A' },
  { name: '董事会纪要-Q2.pdf', type: 'stance', level: 'B' },
];
function initUpload() {
  if (uploadedFiles.length === 0 && !uploadStarted) {
    uploadedFiles = SAMPLE_FILES.map(f => ({ ...f, status: 'ready' }));
  }
  renderFiles();
}
function addFile() {
  const pool = ['某次对外演讲实录.pdf', '高管会复盘纪要.docx', '融资决策记录.md'];
  const name = pool[Math.floor(Math.random() * pool.length)];
  uploadedFiles.push({ name, type: 'story', level: 'C', status: 'ready' });
  renderFiles();
}
function dropFile(e) {
  e.preventDefault();
  e.target.classList.remove('drag');
  addFile();
}
function renderFiles() {
  const list = document.getElementById('fileList');
  if (!list) return;
  list.innerHTML = uploadedFiles.map((f, i) => `
    <div class="file-item">
      <span class="fi-ico">📄</span>
      <div>
        <div class="fi-name">${f.name}</div>
        <div class="fi-meta">${f.status === 'done' ? '已上传 · 清洗完成' : '待上传'}</div>
      </div>
      <div class="fi-right">
        <select class="fi-select" onchange="uploadedFiles[${i}].type=this.value">
          ${['strategy','all_hands','stance','story','speech','style'].map(t => `<option value="${t}" ${f.type===t?'selected':''}>${TYPE_LABEL[t]}</option>`).join('')}
        </select>
        <select class="fi-select" onchange="uploadedFiles[${i}].level=this.value">
          ${['S','A','B','C','D'].map(l => `<option value="${l}" ${f.level===l?'selected':''}>${l}级</option>`).join('')}
        </select>
        ${f.status === 'uploading' ? `<div class="fi-progress"><span style="width:${f.progress||30}%"></span></div><span class="fi-status">上传中</span>` :
          f.status === 'done' ? `<span class="fi-status">✓ 完成</span>` : `<button class="btn btn-ghost" onclick="uploadedFiles.splice(${i},1);renderFiles()">删除</button>`}
      </div>
    </div>`).join('');
}
const TYPE_LABEL = { strategy:'战略文档', all_hands:'全员信', stance:'议题立场', story:'经历故事', speech:'对外演讲', style:'风格素材' };
function startUpload() {
  if (uploadStarted) return;
  uploadStarted = true;
  uploadedFiles.forEach(f => { if (f.status === 'ready') f.status = 'uploading'; });
  renderFiles();
  // 模拟进度
  let prog = 0;
  const timer = setInterval(() => {
    prog += 25;
    uploadedFiles.forEach(f => { if (f.status === 'uploading') f.progress = prog; });
    if (prog >= 100) {
      clearInterval(timer);
      uploadedFiles.forEach(f => { if (f.status === 'uploading') f.status = 'done'; });
    }
    renderFiles();
  }, 500);
}

/* ═══════════════ P4 审核交互 ═══════════════ */
function initReview() { renderReview(); }
function setReviewFilter(f, el) {
  reviewFilter = f;
  document.querySelectorAll('.review-filter').forEach(b => b.classList.toggle('on', b === el));
  renderReview();
}
function renderReview() {
  const list = document.getElementById('principleList');
  if (!list) return;
  const filtered = PRINCIPLES.map((p, i) => ({ ...p, state: principleStates[i], idx: i }))
    .filter(p => reviewFilter === 'all' || (reviewFilter === 'pending' && p.state === 'pending') || (reviewFilter === 'done' && p.state === 'done'));
  if (filtered.length === 0) {
    list.innerHTML = `<div class="card" style="text-align:center;padding:60px 20px;color:var(--muted)">没有符合条件的候选原则</div>`;
    return;
  }
  list.innerHTML = filtered.map(p => `
    <div class="principle-card ${p.state === 'done' ? 'done' : p.state === 'rejected' ? 'rejected' : ''}">
      <div class="pc-top">
        <div class="pc-index">${p.idx + 1}</div>
        <div class="pc-title">${p.title}</div>
        <div class="pc-status">${p.state === 'done' ? '<span class="badge-s s">✓ 已确认</span>' : p.state === 'rejected' ? '<span class="badge-s d">已删除</span>' : '<span class="badge-s a">待审核</span>'}</div>
      </div>
      <div class="pc-fields">
        ${p.fields.map(f => `
          <div class="pc-field">
            <div class="pf-label">${f.label}</div>
            ${f.quote ? `<div class="pf-quote">${f.quote}</div>` : `<div class="pf-val">${f.val}</div>`}
          </div>`).join('')}
      </div>
      <div class="pc-actions">
        ${p.state === 'pending' ? `
          <button class="act-ok" onclick="approvePrinciple(${p.idx})">✓ 确认</button>
          <button class="act-edit" onclick="editPrinciple(${p.idx})">✏️ 修改</button>
          <button class="act-del" onclick="rejectPrinciple(${p.idx})">✗ 删除</button>
        ` : `<button class="act-edit" onclick="resetPrinciple(${p.idx})">↩ 撤销</button>`}
      </div>
    </div>`).join('');
}
function approvePrinciple(i) { principleStates[i] = 'done'; renderReview(); }
function rejectPrinciple(i) { principleStates[i] = 'rejected'; renderReview(); }
function resetPrinciple(i) { principleStates[i] = 'pending'; renderReview(); }
function editPrinciple(i) { alert(`模拟编辑原则「${PRINCIPLES[i].title}」\n（原型中此操作弹出编辑表单）`); }

/* ═══════════════ P5 覆盖度雷达 ═══════════════ */
function initRadar() {
  const wrap = document.getElementById('radarWrap');
  if (!wrap) return;
  const dims = DOMAINS.map((d, i) => ({
    name: d.name, pct: d.pct, color: ['#c8a45c','#7aa5d9','#8fb98f','#d9a84e','#b48bd9'][i],
  }));
  wrap.innerHTML = `
    <svg width="200" height="200" viewBox="0 0 200 200" style="margin-bottom:6px">
      <g transform="translate(100,100)">
        ${[30,60,90].map(r => `<circle r="${r}" fill="none" stroke="var(--border)" stroke-width="1" opacity="0.5"/>`).join('')}
        ${dims.map((d, i) => {
          const ang = (i / dims.length) * Math.PI * 2 - Math.PI / 2;
          const x = 90 * Math.cos(ang), y = 90 * Math.sin(ang);
          const px = (d.pct/100) * 90 * Math.cos(ang), py = (d.pct/100) * 90 * Math.sin(ang);
          return `<line x1="0" y1="0" x2="${x}" y2="${y}" stroke="var(--border)" stroke-width="1" opacity="0.5"/>
                  <circle cx="${px}" cy="${py}" r="4" fill="${d.color}">
                    <animate attributeName="r" from="0" to="4" dur="0.6s" begin="${i*0.15}s" fill="freeze"/>
                  </circle>
                  <text x="${x*1.15}" y="${y*1.15}" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">${d.name}</text>`;
        }).join('')}
        <polygon points="${dims.map((d,i) => { const ang=(i/dims.length)*Math.PI*2-Math.PI/2; const px=(d.pct/100)*90*Math.cos(ang), py=(d.pct/100)*90*Math.sin(ang); return `${px},${py}`; }).join(' ')}" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5">
          <animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze"/>
        </polygon>
      </g>
    </svg>
    ${dims.map((d, i) => `
      <div class="radar-dim">
        <div class="rd-dot" style="background:${d.color}"></div>
        <div class="rd-name">${d.name}</div>
        <div class="rd-track"><div class="rd-fill" style="width:${d.pct}%;background:${d.color};animation:barGrow 1s ${i*0.1}s cubic-bezier(0.22,1,0.36,1) forwards"></div></div>
        <div class="rd-num">${d.pct}%</div>
      </div>`).join('')}
  `;
}

/* ═══════════════ P6 风格预览 ═══════════════ */
const FORMALITY = { 1:'口语化', 2:'偏口语', 3:'中性', 4:'偏书面', 5:'正式书面' };
const CONCISE = { 1:'充分展开', 2:'偏精炼', 3:'平衡', 4:'偏简练', 5:'极简' };
const COUNTER = { 1:'几乎不反问', 2:'少反问', 3:'平衡', 4:'多反问', 5:'频繁反问' };
function updateStyle(slider) {
  const sliders = document.querySelectorAll('.slider');
  const v = [...sliders].map(s => +s.value);
  if (slider) {
    // 更新对应 label
  }
  const f = sliders[0].value, c = sliders[1].value, ct = sliders[2].value;
  document.getElementById('vFormality').textContent = `${f} / 5 · ${FORMALITY[f]}`;
  document.getElementById('vConciseness').textContent = `${c} / 5 · ${CONCISE[c]}`;
  document.getElementById('vCounter').textContent = `${ct} / 5 · ${COUNTER[ct]}`;
  // 预览回复
  const reply = document.getElementById('previewReply');
  if (reply) {
    const openers = ['先看这笔钱带着什么条件。', '战投的钱，从来不是白拿的。', '我们要先问一句：他为什么要投。'];
    const bodies = [
      '如果条件是排他或对赌，那本质是拿未来的自由度换今天的钱，这个代价要算清楚。',
      '战投的价值在于业务协同，如果只有钱没有协同，那和财务投资无异，反而多了站队风险。',
      '我的判断是：先看钱背后的战略意图，再看我们缺不缺这笔钱，最后才看估值。',
    ];
    const short = ct >= 4 ? '你反过来想：如果他投你，对他意味着什么？' : '';
    reply.innerHTML = `${openers[ct % 3]}<br><br>${bodies[c % 3]}${short ? `<br><br><em>${short}</em>` : ''}`;
  }
}
function saveStyle() { alert('已保存风格配置（原型演示）'); }

/* ── P8 补充技能交互 ── */
function setAddMode(mode) {
  const sw = document.getElementById('addSwitch');
  if (!sw) return;
  sw.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  const one = document.getElementById('addOneLiner');
  const form = document.getElementById('addForm');
  if (one) one.style.display = mode === 'one' ? 'block' : 'none';
  if (form) form.style.display = mode === 'form' ? 'block' : 'none';
}
function aiOrganize() {
  const ta = document.querySelector('#addOneLiner textarea');
  const t = (ta.value || '').trim();
  if (!t) { ta.focus(); return; }
  const r = document.getElementById('aiResult');
  r.innerHTML = `
    <div class="card" style="border-color:color-mix(in srgb,var(--accent) 30%,transparent);background:var(--accent-soft)">
      <div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:0.05em;margin-bottom:10px">✨ AI 已整理，请确认</div>
      <div style="margin-bottom:10px"><div style="font-size:11px;font-weight:700;color:var(--muted-2);text-transform:uppercase;margin-bottom:3px">原则陈述</div><div style="font-size:14px;line-height:1.6">「${t}」</div></div>
      <div style="margin-bottom:10px"><div style="font-size:11px;font-weight:700;color:var(--muted-2);text-transform:uppercase;margin-bottom:3px">适用场景</div><div style="font-size:14px;line-height:1.6">当面临「要速度还是要质量」「要规模还是要健康」的两难选择时启用。</div></div>
      <div style="margin-bottom:14px"><div style="font-size:11px;font-weight:700;color:var(--muted-2);text-transform:uppercase;margin-bottom:3px">边界反例</div><div style="font-size:14px;line-height:1.6">战略卡位窗口期（如并购头部标的）可短期放宽，但需明确退出条件。</div></div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-accent" style="flex:1" onclick="this.closest('.card').innerHTML='<div style=padding:20px;text-align:center;color:var(--success);font-weight:700>✓ 已加入原则库</div>'">✓ 确认入库</button>
        <button class="btn btn-ghost" style="flex:1" onclick="this.closest('.card').remove()">✏️ 修改</button>
      </div>
    </div>`;
}

/* ═══════════════ 启动 ═══════════════ */
initTheme();
go('p1');
</script>
