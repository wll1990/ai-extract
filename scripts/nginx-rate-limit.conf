# ============================================================
# 公开接口限流 — 防爬虫/恶意调用
# 用法: cp 到 /etc/nginx/conf.d/ 或 include 到 server {} 块
# ============================================================

limit_req_zone $binary_remote_addr zone=public_read:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=public_write:10m rate=3r/m;
limit_conn_zone $binary_remote_addr zone=per_ip:10m;

# 单 IP 最大并发连接
limit_conn per_ip 10;

# 公开读接口 — 30次/分钟
location ~ ^/api/v1/public/(stats|skills|share/[^/]+$) {
    limit_req zone=public_read burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://backend;
}

# 公开写接口 — 3次/分钟
location ~ ^/api/v1/public/share/[^/]+/guest {
    limit_req zone=public_write burst=2 nodelay;
    limit_req_status 429;
    proxy_pass http://backend;
}

# 公开报告
location ~ ^/api/v1/public/reports/ {
    limit_req zone=public_read burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://backend;
}
