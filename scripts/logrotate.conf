# MindForge 日志轮转配置
# 用法：logrotate -s logs/logrotate.status scripts/logrotate.conf
# 或：logrotate -s logs/logrotate.status scripts/logrotate.conf --force（手动强制执行）

# 管理后台（Next.js）
{PATH}/logs/frontend.log
{PATH}/logs/frontend-error.log {
    daily
    rotate 30
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y%m%d
    compress
    delaycompress
}

# 平台端（Next.js）
{PATH}/logs/platform.log
{PATH}/logs/platform-error.log {
    daily
    rotate 30
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y%m%d
    compress
    delaycompress
}
